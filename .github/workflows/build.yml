name: Build Driftwood ISO

on:
  push:
    branches: [main]
    paths:
      - "plasma/**"
      - "ci/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub release assets must be under 2 GiB.
  ISO_LIMIT_BYTES: "2147483648"

jobs:
  checks:
    name: Config checks and unit tests
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl xz-utils binutils zstd \
            python3 python3-yaml cryptsetup-bin grub-common >/dev/null
      - uses: actions/checkout@v7
      - name: Package lists resolve against trixie
        run: |
          tools/fetch-indices.sh
          python3 tools/check-packages.py plasma
      - name: Calamares configs match the 3.3 schemas
        run: python3 tools/check-calamares.py plasma
      - name: Unit tests
        run: tests/run-all.sh

  build:
    name: Build ISO
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - name: Version
        id: meta
        run: |
          v="13.$(date -u +%y%m%d)-${GITHUB_SHA::7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=Driftwood_Plasma_${v}_x86-64" >> "$GITHUB_OUTPUT"
      - name: live-build (Debian trixie container)
        run: |
          sudo mkdir -p /mnt/build
          docker run --rm --privileged \
            -e VERSION=${{ steps.meta.outputs.version }} -e WORK=/build \
            -v "$PWD:/src" -v /mnt/build:/build -w /src \
            debian:trixie ci/build-iso.sh
          sudo chown -R "$(id -u):$(id -g)" out
          df -h / /mnt
      - name: Size
        run: |
          iso=out/${{ steps.meta.outputs.name }}.iso
          size=$(stat -c %s "$iso")
          pkgs=$(wc -l < out/${{ steps.meta.outputs.name }}.packages)
          {
            echo "### ISO"
            echo ""
            echo "- size: $size bytes ($(numfmt --to=iec-i --suffix=B "$size")), limit $(numfmt --to=iec-i --suffix=B "$ISO_LIMIT_BYTES")"
            echo "- headroom: $(numfmt --to=iec-i --suffix=B $(( ISO_LIMIT_BYTES - size )))"
            echo "- packages: $pkgs"
            echo "- sha256: \`$(cut -d' ' -f1 out/*.sha256)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge "$ISO_LIMIT_BYTES" ]; then
            echo "::error::ISO is $size bytes, over the 2 GiB release-asset limit"
            exit 1
          fi
      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: iso
          path: |
            out/*.iso
            out/*.iso.sha256
          compression-level: 0
          retention-days: 7
      - name: Upload package list and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-info
          path: |
            out/*.packages
            out/*.build.log
            /mnt/build/build.log
          if-no-files-found: ignore
          retention-days: 14

  boot:
    name: Boot test (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [kernel, uefi, bios]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso >/dev/null
          qemu-system-x86_64 --version | head -1
      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: iso
      - name: Verify checksum
        run: cd iso && sha256sum -c *.sha256
      - name: Boot
        run: python3 ci/boot-test.py iso/*.iso --mode ${{ matrix.mode }} --out boot-${{ matrix.mode }}
      - name: Summary
        if: always()
        run: cat boot-${{ matrix.mode }}/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ matrix.mode }}
          path: boot-${{ matrix.mode }}
          retention-days: 14
