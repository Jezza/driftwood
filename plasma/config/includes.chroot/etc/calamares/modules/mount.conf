#
# Mount filesystems in the target (generally, before treating the
# target as a usable chroot / "live" system). Filesystems are
# automatically mounted from the partitioning module. Filesystems
# listed here are **extra**. Entries with `efi: true` are only
# mounted when the host booted via UEFI.
#
# Calamares 3.3 format (src/modules/mount/mount.schema.yaml). Mount
# options moved here from fstab.conf in 3.3; fstab.conf no longer reads them.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# Everything outside @ is left alone by a root rollback. /var/cache and
# /var/tmp hold data with no place in a snapshot (apt's .deb cache would
# otherwise be pinned by every snapshot and restored stale by a rollback).
# /var/lib stays in @: dpkg and package state must roll back together with
# the files they describe.
# /tmp has no subvolume: Debian 13 mounts it as tmpfs (systemd tmp.mount),
# which only happens when fstab has no /tmp entry.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /root
      subvolume: /@root
    - mountPoint: /var/log
      subvolume: /@var@log
    - mountPoint: /var/cache
      subvolume: /@var@cache
    - mountPoint: /var/tmp
      subvolume: /@var@tmp

# A swap file (chosen on the partition page) gets its own subvolume, which
# keeps it out of snapshots.
btrfsSwapSubvol: /@swap

# compress=zstd:1 (#579): level 1 costs almost no CPU and still compresses
# typical system files well; the old unlevelled compress=zstd meant level 3.
# Not listed because they are already the defaults: space_cache=v2 (mkfs
# default since btrfs-progs 5.15) and discard=async (kernel default on
# SSDs since 6.2).
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
