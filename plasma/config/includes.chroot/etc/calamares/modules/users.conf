#
# Calamares 3.3 format. The 3.2 *userGroup* key is gone: Calamares runs
# `useradd -m -U`, giving the user a private primary group, so `users` is
# listed below to keep the membership SpiralLinux had (Driftwood's origin).
#
# Package-owned groups are marked system: if their package is missing,
# Calamares creates them in the system GID range rather than taking a GID
# from the user range.
---
defaultGroups:
    - users
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - { name: netdev, system: true }
    - lp
    - { name: lpadmin, system: true }
    - { name: scanner, system: true }
    - { name: bluetooth, system: true }
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
