#
# Enable, disable or mask systemd units in the target system.
#
# Calamares 3.3 format: one *units* list. Each entry has a *name* (full
# unit name, including the suffix), an *action* passed to systemctl
# (default "enable") and *mandatory* (default false: a failure is logged
# but does not abort the install). The 3.2 keys services/targets/timers/
# disable/disable-targets/mask are ignored by 3.3, so these two units
# were never enabled on bookworm installs.
---
units:
    - name: regenerate_ssh_host_keys.service
      action: enable
    - name: firstboot-update-initramfs.service
      action: enable
