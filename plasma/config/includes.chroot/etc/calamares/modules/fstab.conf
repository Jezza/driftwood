#
# Creates /etc/fstab and /etc/crypttab in the target system.
# Calamares 3.3 format: mount options live in mount.conf now.
---
# Options for each /etc/crypttab line. Calamares puts /crypto_keyfile.bin in
# the key field only when luksbootkeyfile created it, and clears these
# options for root when /boot is unencrypted. The old
# `luks,keyscript=/bin/cat` broke every volume without a keyfile (#515):
# cat of "none" gives an empty key, so the unlock failed.
crypttabOptions: luks

# No /tmp line in fstab: Debian 13's systemd tmp.mount already mounts /tmp
# as tmpfs (size-capped at 50% RAM) and an fstab entry would override it.
# Without this, Calamares writes its own tmpfs /tmp line on SSDs.
tmpOptions:
    default:
        tmpfs: false
    ssd:
        tmpfs: false
